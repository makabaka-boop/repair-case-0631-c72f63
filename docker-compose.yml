# DMX 补丁冲突核验台 —— 容器编排
#
# 发布端口可由宿主机环境变量 WEB_PORT 覆盖，默认 8080：
#   WEB_PORT=9000 docker compose up --build web
#
# 验收服务（一次性运行类型检查 + Vitest + 生产构建后退出）：
#   docker compose up --build verify

services:
  web:
    build: .
    ports:
      - "${WEB_PORT:-8080}:5173"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      # 容器内文件监听回退（部分宿主不支持 inotify 事件透传）
      - CHOKIDAR_USEPOLLING=true
    restart: unless-stopped

  verify:
    build: .
    # tsc --noEmit && vitest run && vite build；任一失败即非零退出
    command: ["npm", "run", "verify"]
    volumes:
      - .:/app
      - /app/node_modules
